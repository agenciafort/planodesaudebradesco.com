<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!--
    Esta URL foi substituida por /sao-paulo/rede-credenciada/ (padrao de diretorio
    usado no resto do site). O arquivo continua aqui de proposito: o host nao
    remove arquivos apagados do repositorio (ver commit 8092e25), entao deletar
    deixaria a versao antiga servindo para sempre, competindo com a nova.

    O canonical aponta para a URL nova para que o Google consolide os sinais nela.
    Nao usar noindex aqui: noindex + canonical se contradizem, e o noindex venceria,
    impedindo a transferencia de sinal. O canonical sozinho e o correto num redirect.

    Um 301 de verdade seria melhor que este meta refresh — se possivel, configurar
    Edge Rule no painel do BunnyCDN redirecionando .html -> diretorio.
-->
<link rel="canonical" href="https://planodesaudebradesco.com/sao-paulo/rede-credenciada/">

    <!-- Icones do site. O favicon e requisito do Google para exibir o icone
         ao lado do resultado de busca; sem ele o site aparece com o globo
         generico e o navegador pede /favicon.ico em toda pagina (404). -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#CC092F">
<meta http-equiv="refresh" content="0; url=/sao-paulo/rede-credenciada/">
<title>Rede Credenciada Bradesco Saúde São Paulo 2026</title>
</head>
<body>
<p>Esta página mudou de endereço.
<a href="/sao-paulo/rede-credenciada/">Ir para a rede credenciada Bradesco Saúde em São Paulo</a>.</p>
</body>
</html>
